# =============================================================================
# DC Property ML Project — Master Configuration
# =============================================================================

project:
  name: "DC Property ML"
  version: "1.0.0"
  author: "Aaron Niecestro"
  seed: 627                          # matches Stat 627 course seed convention
  fast_mode: false                  # if true, use small hyperparameters or cached models

# -----------------------------------------------------------------------------
# Paths
# -----------------------------------------------------------------------------
paths:
  raw_data:       "data/raw/DC_Properties.csv"
  processed_data: "data/processed/dc_clean.rds"
  train_data:     "data/splits/train.rds"
  test_data:      "data/splits/test.rds"
  model_dir:      "models/"
  plot_dir:       "outputs/plots/"
  table_dir:      "outputs/tables/"
  report_dir:     "outputs/reports/"

# -----------------------------------------------------------------------------
# Data Cleaning
# -----------------------------------------------------------------------------
cleaning:
  min_price_10k:  1.0               # drop properties sold for < $10,000
  max_rooms:      40                 # drop implausible room counts
  na_fill_value:  0                  # fill all NAs with 0 (original paper method)

# -----------------------------------------------------------------------------
# Columns to keep after loading
# -----------------------------------------------------------------------------
columns:
  response: "Price_10K"
  numeric:
    - "BATHRM"
    - "ROOMS"
    - "BEDRM"
    - "KITCHENS"
    - "FIREPLACES"
    - "STORIES"
    - "AYB_age"
    - "EYB_age"
    - "Remodel_age"
    - "LATITUDE"
    - "LONGITUDE"
  categorical:
    - "CNDTN"
    - "GRADE"
    - "WARD"
    - "AC"
    - "QUALIFIED"

# -----------------------------------------------------------------------------
# Train / Test Split
# -----------------------------------------------------------------------------
split:
  ratio: 0.50                        # 50 / 50 as per original paper

# -----------------------------------------------------------------------------
# Classification Thresholds
# -----------------------------------------------------------------------------
classification:
  mean_threshold:   57.725           # Reasonable vs. Overpriced (training mean)
  median_threshold: 44.365           # Under vs. Over (training median)
  labels_mean:
    below: "Reasonable"
    above: "Overpriced"
  labels_median:
    below: "Under"
    above: "Over"

# -----------------------------------------------------------------------------
# Feature Engineering — Polynomial Degrees
# -----------------------------------------------------------------------------
polynomial:
  Bathrooms_deg:    8
  Bedrooms_deg:     8
  Fireplaces_deg:   4
  AYB_age_deg:      5
  EYB_age_deg:      4
  Remodel_age_deg:  4
  interactions:
    - ["Bathrooms", "Condition"]     # Bathrooms × Condition

# -----------------------------------------------------------------------------
# Model Hyperparameters
# -----------------------------------------------------------------------------
models:
  knn:
    k_values: [1, 5, 10, 20, 50, 100]
    k_loop_max: 100
  lda:
    priors_equal: [0.5, 0.5]
  qda:
    priors_equal: [0.5, 0.5]
  ridge:
    alpha: 0                         # glmnet alpha=0 → Ridge
    nfolds: 10
  lasso:
    alpha: 1                         # glmnet alpha=1 → Lasso
    nfolds: 10
  pcr:
    ncomp_max: 31
    validation: "CV"
  pls:
    ncomp_max: 31
    validation: "CV"
  tree:
    method: "anova"                  # regression tree
    cp_prune: "min"                  # prune using minimum xerror
  random_forest:
    ntree_values: [143, 400, 500]
    mtry_range: [1, 3, 5]
    importance: true
  bagging:
    ntree: 200
  svm:
    kernels: ["linear", "radial", "polynomial", "sigmoid"]
    cost_default: 1
    gamma_default: 0.1

# -----------------------------------------------------------------------------
# Pipeline Caching & Fast Mode
# -----------------------------------------------------------------------------
cache:
  enabled: true                     # turn caching on/off
  dir: "cache/"                     # where cached models/data are stored
  use_cached_data: true             # skip preprocessing if cached data exists
  use_cached_models: true           # skip model training if cached models exist
